[project]
name = "decision-server"
version = "0.1.0"
description = "A local web server and Gradio UI for serving decision models (choice, noul, score) behind one typed contract."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "decision-server contributors" }]
dependencies = [
    "fastapi>=0.115,<1",
    "gradio>=5.0,<6",
    "httpx>=0.28,<1",
    "huggingface-hub>=1,<2",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# Runtime extras for in-process model backends. Install only what a model needs.
torch = ["torch>=2.6"]
transformers = ["transformers>=5.15,<6"]
sentence-transformers = ["sentence-transformers>=6,<7"]
bitsandbytes = ["bitsandbytes>=0.49,<1"]
accelerate = ["accelerate>=1,<2"]
safetensors = ["safetensors>=0.7,<1"]
peft = ["peft>=0.17,<1"]
gliner2 = ["gliner2[local]>=2.1,<3"]
open-models = [
    "torch>=2.6",
    "transformers>=5.15,<6",
    "peft>=0.17,<1",
    "accelerate>=1,<2",
    "safetensors>=0.7,<1",
]

[project.scripts]
decision-server = "decision_server.__main__:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9", "ty>=0.0.84"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
